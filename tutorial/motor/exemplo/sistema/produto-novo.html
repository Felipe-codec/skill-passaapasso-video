<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Novo produto · Lumen Estoque</title><link rel="stylesheet" href="app.css"></head><body>
<aside><div class="logo"><i></i>Lumen Estoque</div>
<a href="index.html" class=""><span></span>Painel</a>
<a href="produtos.html" class="ativo"><span></span>Produtos</a>

<main><header><div><h1>Novo produto</h1><div class="sub">Produtos › Novo produto</div></div></header>
<form class="form" action="produtos.html">
<div class="campo"><label for="nome">Nome do produto</label><input id="nome" name="nome" placeholder="Ex.: Caneca de cerâmica"></div>
<div class="linha"><div class="campo"><label for="categoria">Categoria</label><select id="categoria" name="categoria"><option value="">Selecione</option><option>Cozinha</option><option>Iluminação</option><option>Banho</option><option>Decoração</option></select></div>
<div class="campo"><label for="preco">Preço de venda</label><input id="preco" name="preco" placeholder="0,00"></div></div>
<div class="linha"><div class="campo"><label for="qtd">Estoque inicial</label><input id="qtd" name="qtd" placeholder="0"></div><div class="campo"><label for="sku">Código (SKU)</label><input id="sku" name="sku" placeholder="Gerado automaticamente"></div></div>
<div class="acoes"><a class="btn btn-sec" href="produtos.html">Cancelar</a><button class="btn btn-pri" id="salvar" type="submit">Salvar produto</button></div>
</form></main></body></html>
